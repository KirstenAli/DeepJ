name: Flash capability diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check actual virtual GPU matrix support
        run: |
          swift - <<'SWIFT'
          import Metal
          import Foundation
          let device = MTLCreateSystemDefaultDevice()!
          print("DEVICE", device.name)
          print("APPLE7", device.supportsFamily(.apple7))
          print("MAC2", device.supportsFamily(.mac2))
          let source = """
          #include <metal_stdlib>
          #include <metal_simdgroup_matrix>
          using namespace metal;
          kernel void probe(device float* result [[buffer(0)]]) {
              simdgroup_float8x8 a(1.0f), b(1.0f), c(0.0f);
              simdgroup_multiply_accumulate(c, a, b, c);
              simdgroup_store(c, result, 8);
          }
          """
          do {
              let library = try device.makeLibrary(source: source, options: nil)
              let pipeline = try device.makeComputePipelineState(function: library.makeFunction(name: "probe")!)
              let buffer = device.makeBuffer(length: 64 * 4, options: .storageModeShared)!
              let command = device.makeCommandQueue()!.makeCommandBuffer()!
              let encoder = command.makeComputeCommandEncoder()!
              encoder.setComputePipelineState(pipeline)
              encoder.setBuffer(buffer, offset: 0, index: 0)
              encoder.dispatchThreadgroups(MTLSize(width: 1, height: 1, depth: 1),
                  threadsPerThreadgroup: MTLSize(width: 32, height: 1, depth: 1))
              encoder.endEncoding()
              command.commit()
              command.waitUntilCompleted()
              print("STATUS", command.status.rawValue, command.error as Any)
              let values = buffer.contents().bindMemory(to: Float.self, capacity: 64)
              print("VALUES", (0..<64).map { values[$0] })
          } catch {
              print("MATRIX_UNAVAILABLE", error)
          }
          SWIFT
