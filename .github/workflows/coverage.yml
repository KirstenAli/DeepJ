name: Free macOS Metal diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal-probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Metal device access on the standard free runner
        id: probe
        run: swift scripts/diagnostics/metal-probe.swift
      - uses: actions/setup-java@v4
        if: steps.probe.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '20'
      - name: Run actual Metal numerical tests with required-device preflight
        if: steps.probe.outputs.available == 'true'
        run: >-
          mvn --batch-mode -Pfull-coverage
          -Dtest=CoverageEnvironmentTest,MetalBackendTest,MetalBackendTrainingTest,MetalBackendDifferentialTest,MetalModelDifferentialTest,ModelSerializerMetalTest,MetalLegacyKernelTest,MetalNativeValidationTest
          test
      - name: Explain an unavailable GPU without claiming Metal tests passed
        if: steps.probe.outputs.available == 'false'
        run: echo 'The standard macOS runner exposes no Metal device. GPU tests were not run.'
