name: Tests and coverage

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
          cache: maven
      - name: Test and enforce coverage thresholds
        run: mvn --batch-mode clean verify
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            target/site/jacoco/
            target/coverage/
            target/surefire-reports/
  metal:
    # DeepJ's existing Metal compile options require a macOS 15 or newer SDK.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
          cache: maven
      - name: Run Metal, desktop and native checks with required GPU coverage
        run: mvn --batch-mode clean verify -Pfull-coverage
      - name: Report coverage details when the full build fails
        if: failure()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            sed -n '1,260p' target/site/jacoco/jacoco.csv
          fi
          if [ -f target/coverage/native/deepj_metal_coverage.mm ]; then
            target/node/node scripts/coverage/check-native.mjs
          fi
      - name: Save native code-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-quality-report
          path: target/quality/native/report.json
