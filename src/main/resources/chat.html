<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepJ Chat</title>
    <link rel="stylesheet" href="chat.css" />
    <script defer src="chat.js"></script>
  </head>
  <body class="theme-light">
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-sidebar" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="icon-new" viewBox="0 0 24 24">
        <path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7" />
        <path d="m14 4 6 6M10 14l9-9a2.1 2.1 0 0 1 3 3l-9 9-4 1z" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16M9 4v6M15 14v6" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7" /></symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" /></symbol>
    </svg>
    <div id="app" class="empty">
      <aside id="sidebar" aria-label="Sidebar">
        <div class="sidebar-heading">
          <span class="brand">DeepJ</span>
          <button
            type="button"
            id="collapseSidebar"
            class="icon-button"
            aria-label="Close sidebar"
            title="Close sidebar"
          >
            <svg><use href="#icon-sidebar" /></svg>
          </button>
        </div>
        <button type="button" id="newChat" class="nav-button">
          <svg><use href="#icon-new" /></svg><span>New chat</span>
        </button>
        <div class="sidebar-spacer"></div>
        <button type="button" id="openSettings" class="nav-button">
          <svg><use href="#icon-settings" /></svg><span>Settings</span>
        </button>
        <div class="sidebar-status">
          <span class="status-dot"></span><span id="status">Choose a model to begin</span>
        </div>
      </aside>
      <div id="main">
        <header class="topbar">
          <button
            type="button"
            id="reopenSidebar"
            class="icon-button"
            aria-label="Open sidebar"
            title="Open sidebar"
          >
            <svg><use href="#icon-sidebar" /></svg>
          </button>
          <div class="model-control">
            <button
              type="button"
              id="modelPicker"
              class="model-picker"
              aria-expanded="false"
              aria-label="Choose DeepJ model"
            >
              <span>DeepJ</span><svg><use href="#icon-chevron" /></svg>
            </button>
            <div id="modelMenu" class="model-menu" hidden>
              <button type="button" id="menuLoad" class="menu-item">
                <svg><use href="#icon-folder" /></svg><span>Open local model…</span>
              </button>
              <div id="modelName" class="menu-detail">No model loaded</div>
            </div>
          </div>
        </header>
        <div id="workspace">
          <section id="conversation" aria-label="Conversation">
            <div id="welcome">
              <h1>What can I help with?</h1>
              <p>Choose a local DeepJ model to get started.</p>
            </div>
            <div id="messages" role="log" aria-live="polite"></div>
          </section>
          <footer id="composerArea">
            <div id="composer">
              <textarea
                id="prompt"
                rows="1"
                placeholder="Ask DeepJ"
                aria-label="Message DeepJ"
              ></textarea>
              <div class="composer-actions">
                <button
                  type="button"
                  id="composerModel"
                  class="icon-button"
                  aria-label="Open model"
                  title="Open model"
                >
                  <svg><use href="#icon-plus" /></svg>
                </button>
                <span id="composerHint">Local model</span>
                <button
                  type="button"
                  id="send"
                  class="send-button"
                  aria-label="Send message"
                  title="Send message"
                  disabled
                >
                  <svg><use href="#icon-send" /></svg>
                </button>
              </div>
            </div>
            <p class="disclaimer">DeepJ runs locally. Small models may produce inaccurate text.</p>
          </footer>
        </div>
      </div>
    </div>
    <div id="settingsBackdrop" class="modal-backdrop" hidden>
      <section
        class="settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
      >
        <div class="dialog-heading">
          <h2 id="settingsTitle">Settings</h2>
          <button
            type="button"
            id="closeSettings"
            class="icon-button"
            aria-label="Close settings"
            title="Close settings"
          >
            <svg><use href="#icon-close" /></svg>
          </button>
        </div>
        <h3>Appearance</h3>
        <div class="theme-options" role="group" aria-label="Theme">
          <button type="button" class="theme-choice selected" data-theme="light">
            <span class="theme-swatch light"></span>Light
          </button>
          <button type="button" class="theme-choice" data-theme="dark">
            <span class="theme-swatch dark"></span>Dark
          </button>
          <button type="button" class="theme-choice" data-theme="warm">
            <span class="theme-swatch warm"></span>Warm
          </button>
          <button type="button" class="theme-choice" data-theme="ocean">
            <span class="theme-swatch ocean"></span>Ocean
          </button>
        </div>
        <details id="generationOptions">
          <summary>
            Generation settings <svg><use href="#icon-chevron" /></svg>
          </summary>
          <div class="settings-grid">
            <label>
              <span>Temperature</span>
              <input id="temperature" type="number" min="0.01" max="3" step="0.01" value="0.8" />
            </label>
            <label>
              <span>Top-k</span>
              <input id="topK" type="number" min="0" step="1" value="40" />
            </label>
            <label>
              <span>Maximum tokens</span>
              <input id="maxTokens" type="number" min="1" step="1" value="80" />
            </label>
            <label>
              <span>Seed</span>
              <input id="seed" type="number" step="1" value="1234" />
            </label>
            <label>
              <span>Repetition penalty</span>
              <input id="repetitionPenalty" type="number" min="1" max="2" step="0.05" value="1" />
              <small>1.0 is off. Try 1.1 if text loops.</small>
            </label>
            <label class="cache-choice">
              <span><input id="rollingCache" type="checkbox" /> Rolling KV cache</span>
              <small
                >Keep decoding fast after the window fills. RoPE models only; long responses may
                change.</small
              >
            </label>
          </div>
        </details>
        <button type="button" id="doneSettings" class="done-button">Done</button>
      </section>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
