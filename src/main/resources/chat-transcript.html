<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body { min-height: 100%; margin: 0; background: var(--background); color: var(--text); }
    body.light { --background: #fff; --text: #1b1b1b; --muted: #747474; --bubble: #f1f1f1; --hover: #ededed; }
    body.dark { --background: #212121; --text: #f3f3f3; --muted: #aaa; --bubble: #303030; --hover: #393939; color-scheme: dark; }
    body.warm { --background: #faf7f0; --text: #312b24; --muted: #766f64; --bubble: #eee7dc; --hover: #e8dfd2; }
    body.ocean { --background: #edf5f7; --text: #173039; --muted: #607983; --bubble: #dcebf0; --hover: #cde3ea; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 34px 48px; }
    #welcome { margin: 24vh auto 0; text-align: center; font-size: 27px; font-weight: 650; }
    #welcome small { display: block; margin-top: 12px; color: var(--muted); font-size: 15px; font-weight: 400; }
    article { margin: 0 0 28px; line-height: 1.55; font-size: 15px; }
    article.user { display: flex; justify-content: flex-end; }
    article.user .content { max-width: min(78%, 620px); padding: 11px 16px; background: var(--bubble); border-radius: 18px; }
    article.assistant { display: flex; align-items: flex-start; gap: 12px; }
    .avatar { flex: none; width: 30px; height: 30px; border-radius: 10px; background: var(--text); color: var(--background); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
    .answer { min-width: 0; flex: 1; padding-top: 3px; }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .copy { margin: 6px 0 0 -5px; border: 0; padding: 4px 6px; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
    .copy:hover { background: var(--hover); color: var(--text); }
    ::selection { background: #9dc7ec; color: #111; }
  </style>
</head>
<body class="light">
  <main><div id="welcome">What would you like to explore?<small>Load a DeepJ model to begin.</small></div><div id="messages"></div></main>
  <script>
    function setTheme(name) { document.body.className = name; }
    function clearMessages() { document.getElementById('messages').replaceChildren(); document.getElementById('welcome').hidden = false; }
    function showMessage(id, role, text) {
      const nearBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight < 90;
      let item = document.getElementById('message-' + id);
      if (!item) item = createMessage(id, role);
      item.querySelector('.content').textContent = text;
      item.querySelector('.copy')?.setAttribute('aria-label', 'Copy response');
      document.getElementById('welcome').hidden = true;
      if (nearBottom) window.scrollTo(0, document.documentElement.scrollHeight);
    }
    function createMessage(id, role) {
      const item = document.createElement('article');
      item.id = 'message-' + id;
      item.className = role;
      const answer = document.createElement('div');
      answer.className = role === 'assistant' ? 'answer' : 'content';
      if (role === 'assistant') {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.textContent = 'D';
        item.append(avatar);
      }
      const content = role === 'assistant' ? document.createElement('div') : answer;
      content.className = 'content';
      if (role === 'assistant') {
        const copy = document.createElement('button');
        copy.className = 'copy';
        copy.textContent = 'Copy';
        copy.onclick = () => chatBridge.copy(content.textContent);
        answer.append(content, copy);
      }
      item.append(answer);
      document.getElementById('messages').append(item);
      return item;
    }
  </script>
</body>
</html>
